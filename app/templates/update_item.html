{% extends "base.html" %}

{% block title %}Update Inventory Item{% endblock %}

{% block content %}
    <h1 class="mb-4">Update Inventory Item</h1>

    <form method="POST" action="{{ url_for('inventory.update_inventory', item_id=item['id']) }}">
        <div class="mb-3">
            <label for="name" class="form-label">Item Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ item['name'] }}" required>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" name="category" value="{{ item['category'] }}">
        </div>

        <div class="mb-3">
            <label for="stock_quantity" class="form-label">Stock Quantity</label>
            <input type="number" class="form-control" id="stock_quantity" name="stock_quantity" value="{{ item['stock_quantity'] }}" min="0" required>
        </div>

        <div class="mb-3">
            <label for="unit" class="form-label">Unit</label>
            <select class = "form-select" id = "unit" name = "unit">
                {% for unit in units %}
                    {% if unit == item['unit'] %}
                        <option value="{{ unit }}" selected>{{ unit }}</option>
                    {% else %}
                        <option value="{{ unit }}">{{ unit }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <div class = "mb-3">
            <label for = "cost_price" class = "form-label">Cost Price (₱)</label>
            <input type = "number" step = "0.01"
                   class = "form-control"
                   id = "cost_price"
                   name = "cost_price"
                   value = "{{ item['cost_price'] }}">
        </div>

        <div class = "mb-3">
            <label for="selling_price" class="form-label">Selling Price (₱) <span class="text-muted">(leave unchanged or clear to recalculate)</span></label>
            <input type = "number" step = "0.01"
                   class = "form-control"
                   id = "selling_price"
                   name = "selling_price"
                   value = "{{ item['selling_price'] }}">
        </div>

        <div class = "mb-3">
            <label for = "low_stock_threshold"
                   class = "form-label">Low Stock Threshold</label>
            <input type = "number"
                   min = "0"
                   class = "form-control"
                   id = "low_stock_threshold"
                   name = "low_stock_threshold"
                   value = "{{ item['low_stock_threshold'] }}">
        </div>

        <button type ="submit"
                class ="btn btn-success">Update Item</button>
        <a href="{{ url_for('inventory.get_all_inventory') }}"
           class ="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
