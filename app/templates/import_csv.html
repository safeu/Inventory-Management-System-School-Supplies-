{% extends "base.html" %}
{% block title %}Import CSV{% endblock %}

{% block content %}
    <h1 class="mb-4">Import Inventory from CSV</h1>

    <p class="text-muted">Upload a CSV file with the following columns (in order): 
        <code>name, stock_quantity, price, low_stock_threshold, category, unit</code>
    </p>

    <form method="POST" action="{{ url_for('inventory.import_inventory') }}" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="file" class="form-label">Select CSV File</label>
            <input type="file" class="form-control" id="file" name="file" accept=".csv" required>
        </div>

        <button type="submit" class="btn btn-success">Import</button>
        <a href="{{ url_for('inventory.get_all_inventory') }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
